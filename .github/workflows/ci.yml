name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOCMIND_DATABASE_URL: postgresql+psycopg://docmind_test:docmind-test@127.0.0.1:5432/docmind_test
      DOCMIND_TEST_DATABASE_URL: postgresql+psycopg://docmind_test:docmind-test@127.0.0.1:5432/docmind_test
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: docmind_test
          POSTGRES_PASSWORD: docmind-test
          POSTGRES_DB: docmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docmind_test -d docmind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app tests migrations
      - run: python -m ruff format --check app tests migrations
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m unittest discover -s tests -v
      - run: python -m alembic downgrade base
      - run: python -m alembic upgrade head
